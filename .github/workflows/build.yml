name: Build & Release (Android armv8 + Web)

# NEON ECHO — CI pipeline.
#
# Uses the OFFICIAL open-source GameMaker CLI: `@gamemaker/gm-cli` (Apache-2.0,
# published by YoYoGames/Opera). It runs on stock GitHub `ubuntu-latest` runners
# and downloads Igor + the GameMaker runtime + everything else on demand, with a
# guest license supplied automatically — so NO custom Docker image and NO license
# secret are required. The Android SDK/NDK/JDK and debug keystore are all
# provisioned INSIDE the GitHub runner below (nothing is installed on any
# developer machine).
#
# What it does:
#   1. Builds a debug-signed armv8 (arm64) Android APK.
#   2. Builds a browser (web) export and zips it.
#   3. Publishes the web build to GitHub Pages.
#   4. Creates a GitHub Release and uploads BOTH the armv8 APK and the web ZIP to
#      that same release.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2026.1108)'
        required: false
        default: ''

permissions:
  contents: write      # upload release assets
  pages: write         # deploy GitHub Pages
  id-token: write      # OIDC for Pages deployment

env:
  GM_COMMAND: "@gamemaker/gm-cli@latest"
  PROJECT_YYP: neon-echo.yyp
  WEB_ZIP_NAME: neon-echo-web.zip
  APK_NAME: NeonEcho-armv8-debug.apk
  # Android debug keystore (matches the Android SDK's default debug keystore).
  KEYSTORE_ALIAS: androiddebugkey
  KEYSTORE_PASS: android

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Android — debug-signed armv8 APK
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (armv8, debug-signed)
    runs-on: ubuntu-latest
    env:
      # Exact versions required by GameMaker (see YoYoGames/GameMaker-Bugs
      # wiki "Android-GMS2" setup guide).
      ANDROID_API: 36
      ANDROID_BUILD_TOOLS: 37.0.0
      ANDROID_NDK: 30.0.15729638
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (cmdline-tools, platform, build-tools, NDK)
        # Uses the maintained android-actions/setup-android action: it downloads a
        # known-good cmdline-tools, auto-accepts licenses (feeding them via stdin,
        # avoiding the `yes |` broken-pipe problem), and installs the packages we
        # list. It exports ANDROID_HOME + ANDROID_SDK_ROOT for later steps.
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.ANDROID_API }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} platform-tools ndk;${{ env.ANDROID_NDK }}"
          accept-android-sdk-licenses: "true"

      - name: Cache gm-cli (Igor + runtime + project build)
        uses: actions/cache@v4
        with:
          path: .gmcache
          key: ${{ runner.os }}-gmcache-android-${{ hashFiles('neon-echo.yyp') }}

      - name: Install FFmpeg (required for Linux builds)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/share/ffmpeg-bin
          key: ${{ runner.os }}-ffmpeg-6.0.1

      - name: Install FFmpeg if not cached
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          VERSION=6.0.1
          RELEASE_NAME=ffmpeg-${VERSION}-amd64-static
          mkdir -p ~/.local/share/ffmpeg-bin
          wget -q --timeout=8 --tries=10 https://www.johnvansickle.com/ffmpeg/old-releases/${RELEASE_NAME}.tar.xz
          tar -xf ${RELEASE_NAME}.tar.xz
          mv ${RELEASE_NAME}/ffmpeg ${RELEASE_NAME}/ffprobe ~/.local/share/ffmpeg-bin/
          rm -rf ${RELEASE_NAME} ${RELEASE_NAME}.tar.xz
      - run: echo "$HOME/.local/share/ffmpeg-bin" >> $GITHUB_PATH

      - name: Generate debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass "${{ env.KEYSTORE_PASS }}" \
            -keypass "${{ env.KEYSTORE_PASS }}" \
            -alias "${{ env.KEYSTORE_ALIAS }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Write gm-options.json (Android SDK + keystore)
        shell: bash
        run: |
          # ANDROID_HOME is exported by the setup-android action (defaults to
          # ~/.android/sdk). The NDK lives at $ANDROID_HOME/ndk/<version>.
          cat > gm-options.json <<EOF
          {
            "toolchain": "GMS2",
            "gms2": {
              "android": {
                "packageType": "apk",
                "sdkPath": "$ANDROID_HOME",
                "ndkPath": "$ANDROID_HOME/ndk/$ANDROID_NDK",
                "jdkPath": "$JAVA_HOME",
                "keystoreFile": "$KEYSTORE_FILE",
                "keystoreAlias": "${{ env.KEYSTORE_ALIAS }}",
                "keystorePassword": "${{ env.KEYSTORE_PASS }}",
                "keystoreAliasPassword": "${{ env.KEYSTORE_PASS }}"
              }
            }
          }
          EOF
          echo "---- gm-options.json ----"
          cat gm-options.json

      - name: Build armv8 debug APK
        shell: bash
        run: |
          set -euo pipefail
          # arm64 (armv8) architecture is selected in options/android/options_android.yy
          # (option_android_arch_arm64: true), so the APK is arm64-only.
          npx "$GM_COMMAND" package \
            --target android \
            --output "${{ env.APK_NAME }}" \
            "${{ env.PROJECT_YYP }}"
          ls -la "${{ env.APK_NAME }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-armv8-debug
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Web — browser export (zipped)
  # ---------------------------------------------------------------------------
  build-web:
    name: Build Web (browser / OperaGX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache gm-cli
        uses: actions/cache@v4
        with:
          path: .gmcache
          key: ${{ runner.os }}-gmcache-web-${{ hashFiles('neon-echo.yyp') }}

      - name: Install FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/share/ffmpeg-bin
          key: ${{ runner.os }}-ffmpeg-6.0.1

      - name: Install FFmpeg if not cached
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          VERSION=6.0.1
          RELEASE_NAME=ffmpeg-${VERSION}-amd64-static
          mkdir -p ~/.local/share/ffmpeg-bin
          wget -q --timeout=8 --tries=10 https://www.johnvansickle.com/ffmpeg/old-releases/${RELEASE_NAME}.tar.xz
          tar -xf ${RELEASE_NAME}.tar.xz
          mv ${RELEASE_NAME}/ffmpeg ${RELEASE_NAME}/ffprobe ~/.local/share/ffmpeg-bin/
          rm -rf ${RELEASE_NAME} ${RELEASE_NAME}.tar.xz
      - run: echo "$HOME/.local/share/ffmpeg-bin" >> $GITHUB_PATH

      - name: Build web bundle (OperaGX / HTML5-WASM)
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: The open-source GameMaker CLI currently packages these targets:
          #   mac, windows, linux, operagx, android
          # The legacy `html5` target is not wired into `package` yet ("coming
          # soon"), so the browser build below uses `operagx` (GX.games), which is
          # the HTML5/WebAssembly web export. Its zip contains the served game
          # (index.html + game files) for static hosting.
          npx "$GM_COMMAND" package \
            --target operagx \
            --output "${{ env.WEB_ZIP_NAME }}" \
            "${{ env.PROJECT_YYP }}"
          # Unpack for GitHub Pages; locate the served root (the folder with index.html).
          mkdir -p site
          unzip -o "${{ env.WEB_ZIP_NAME }}" -d site > /dev/null
          INDEX="$(find site -name index.html -print -quit)"
          if [ -n "$INDEX" ]; then
            echo "WEB_DIR=$(dirname "$INDEX")" >> "$GITHUB_ENV"
          else
            echo "WEB_DIR=$(pwd)/site" >> "$GITHUB_ENV"
            echo "::warning::No index.html found in web bundle; serving unpacked tree as-is."
          fi

      - name: Upload web ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ${{ env.WEB_ZIP_NAME }}
          if-no-files-found: error

      - name: Upload Pages artifact (expanded site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB_DIR }}

  # ---------------------------------------------------------------------------
  # 3. GitHub Pages deploy
  # ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy web to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 4. Release — publish APK + web ZIP together
  # ---------------------------------------------------------------------------
  release:
    name: Publish release (APK + web ZIP)
    needs: [build-android, build-web]
    runs-on: ubuntu-latest
    # Only create a release on version tags or explicit dispatch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-armv8-debug
          path: dist

      - name: Download web ZIP
        uses: actions/download-artifact@v4
        with:
          name: web
          path: dist

      - name: Determine release tag & version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +%Y.%m.%d)-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "NEON ECHO — ${{ steps.meta.outputs.version }}"
          body: |
            # NEON ECHO — ${{ steps.meta.outputs.version }}

            A 2D cyberpunk story in five episodes. Vector-art only; no bitmap assets.

            ## Downloads
            - **Android (armv8, debug-signed)** — `${{ env.APK_NAME }}`
            - **Web build** — `${{ env.WEB_ZIP_NAME }}` (also live on GitHub Pages)

            ## Also deployed to GitHub Pages
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.WEB_ZIP_NAME }}
          generate_release_notes: true